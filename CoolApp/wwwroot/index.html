<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoolApp · .NET on Self-Hosted Runner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="bg"></div>

    <main class="card">
      <div class="status" id="status">
        <span class="dot"></span><span id="statusText">Idle</span>
      </div>

      <div class="logo">⚡</div>
      <h1>CoolApp</h1>
      <p class="subtitle">
        A tiny .NET web app, deployed via a self-hosted GitHub runner
      </p>

      <div class="clock" id="clock">--:--:--</div>

      <button id="pingBtn">
        <span class="btn-label">Ping the server</span>
      </button>

      <section id="result" class="result hidden">
        <p class="message" id="message"></p>
        <div class="meta">
          <div class="meta-row">
            <span>🕒 Server time</span><b id="time"></b>
          </div>
          <div class="meta-row">
            <span>⚡ Framework</span><b id="framework"></b>
          </div>
          <div class="meta-row">
            <span>🌍 Environment</span><b id="environment"></b>
          </div>
          <div class="meta-row">
            <span>🏷️ Version</span><b id="version"></b>
          </div>
          <div class="meta-row"><span>🔗 Commit</span><b id="commit"></b></div>
          <div class="meta-row"><span>⏱️ Uptime</span><b id="uptime"></b></div>
        </div>
      </section>

      <footer class="badges">
        <span class="badge dotnet">.NET</span>
        <span class="badge docker">Docker</span>
        <span class="badge gha">GitHub Actions</span>
        <span class="badge runner">Self-Hosted</span>
      </footer>
    </main>

    <script src="/js/app.js"></script>
  </body>
</html>
